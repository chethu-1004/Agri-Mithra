services:
  postgres:
    image: postgres:16
    container_name: agrinetra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrinetra
      POSTGRES_USER: agrinetra
      POSTGRES_PASSWORD: agrinetra
    ports:
      - "5432:5432"
    volumes:
      - agrinetra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrinetra -d agrinetra"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  agrinetra_pgdata:
